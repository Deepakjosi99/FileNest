<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        width="64"
        height="64"
>
    <defs>
        <linearGradient
                id="folderGradient"
                x1="8"
                y1="6"
                x2="55"
                y2="58"
                gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#9A6BFF"/>
            <stop offset="48%" stop-color="#6D5DFC"/>
            <stop offset="100%" stop-color="#4338CA"/>
        </linearGradient>

        <filter
                id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="150%"
        >
            <feDropShadow
                    dx="0"
                    dy="3"
                    stdDeviation="3"
                    flood-color="#4F46E5"
                    flood-opacity="0.30"
            />
        </filter>
    </defs>

    <!-- Light rounded background -->
    <rect
            x="2"
            y="2"
            width="60"
            height="60"
            rx="16"
            fill="#F5F3FF"
    />

    <!-- Folder -->
    <path
            d="
        M10 19
        C10 14.6 13.6 11 18 11
        H29
        C31.3 11 33.2 12 34.7 13.8
        L39 19
        H47
        C51.4 19 55 22.6 55 27
        V46
        C55 50.4 51.4 54 47 54
        H17
        C12.6 54 9 50.4 9 46
        V20
        C9 19.4 9.4 19 10 19
        Z
        "
            fill="url(#folderGradient)"
            filter="url(#shadow)"
    />

    <!-- Folder highlight -->
    <path
            d="
        M10 26
        C10 22.7 12.7 20 16 20
        H49
        C51.7 20 54 21.7 55 24
        V28
        H10
        Z
        "
            fill="#FFFFFF"
            opacity="0.15"
    />

    <!-- F -->
    <path
            d="
        M23 27
        C23 24.8 24.8 23 27 23
        H43
        V30
        H31
        V35
        H41
        V42
        H31
        V51
        H23
        Z
        "
            fill="#FFFFFF"
    />
</svg>