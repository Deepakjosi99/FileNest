<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>FileNest Logo</title>

        <style>
            body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            }

            .filenest-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            }

            .logo-icon {
            width: 74px;
            height: 74px;
            flex-shrink: 0;
            }

            .logo-content {
            display: flex;
            flex-direction: column;
            }

            .logo-name {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1.5px;
            color: #111827;
            }

            .logo-name span {
            background: linear-gradient(
            135deg,
            #6d5dfc,
            #713df2
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            }

            .logo-tagline {
            margin-top: 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.4px;
            color: #8b92a5;
            }
        </style>
    </head>

    <body>

        <div class="filenest-logo">

            <svg
                    class="logo-icon"
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                            id="folderGradient"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                    >
                        <stop
                                offset="0%"
                                stop-color="#8b5cf6"
                        />

                        <stop
                                offset="45%"
                                stop-color="#6d5dfc"
                        />

                        <stop
                                offset="100%"
                                stop-color="#4338ca"
                        />
                    </linearGradient>

                    <filter
                            id="shadow"
                            x="-30%"
                            y="-30%"
                            width="160%"
                            height="160%"
                    >
                        <feDropShadow
                                dx="0"
                                dy="7"
                                stdDeviation="6"
                                flood-color="#6557e8"
                                flood-opacity="0.28"
                        />
                    </filter>

                </defs>


                <!-- Rounded background -->

                <rect
                        x="5"
                        y="5"
                        width="90"
                        height="90"
                        rx="24"
                        fill="#f5f3ff"
                />


                <!-- Folder -->

                <path
                        d="
                M18 30
                C18 23 23 18 30 18
                H48
                C52 18 55 20 58 24
                L63 30
                H75
                C82 30 87 35 87 42
                V75
                C87 82 82 87 75 87
                H29
                C22 87 17 82 17 75
                V30
                Z
            "
                        fill="url(#folderGradient)"
                        filter="url(#shadow)"
                />


                <!-- Folder top highlight -->

                <path
                        d="
                M18 40
                C18 34 23 30 29 30
                H79
                C83 30 86 32 87 35
                L87 43
                H18
                Z
            "
                        fill="#ffffff"
                        opacity="0.14"
                />


                <!-- F -->

                <path
                        d="
                M37 43
                C37 39 40 36 44 36
                H69
                V46
                H49
                V55
                H65
                V65
                H49
                V81
                H37
                Z
            "
                        fill="#ffffff"
                />

            </svg>


            <div class="logo-content">

                <h1 class="logo-name">
                    File<span>Nest</span>
                </h1>

                <div class="logo-tagline">
                    SMART FILE TOOLS
                </div>

            </div>

        </div>

    </body>
</html>